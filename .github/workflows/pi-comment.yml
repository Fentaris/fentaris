name: Pi Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

# Permessi più ampi di pi-review.yml perché qui l'agent può anche
# fixare issue creando push/nuove PR (loaded_tools: all).
permissions:
  contents: write
  issues: write
  pull-requests: write

# Evita run sovrapposte su commenti /pi consecutivi
concurrency:
  group: pi-comment-${{ github.event.issue.number || github.event.pull_request.number || github.run_number }}
  cancel-in-progress: true

jobs:
  pi:
    # Trigger quando un commento inizia con /pi, SOLO da utenti fidati
    # (P1 security: evitare che chiunque possa guidare un agent con write access)
    if: |
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/pi ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       startsWith(github.event.review.body, '/pi ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       startsWith(github.event.comment.body, '/pi ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Il fork check vero e proprio è nello step `actions/checkout` (più sotto)
    # perché solo lì possiamo condizionare l'accesso al branch.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Per issue_comment, github.event.pull_request non esiste;
      # bisogna fetchare l'head ref via API. Per gli altri eventi è già nel payload.
      # Filtra per issue PR-only: una issue normale (non PR) darebbe 404.
      - name: Get PR head ref (for issue_comment on PRs only)
        id: pr-ref
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ github.event.issue.number }}
          HEAD_REF=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}" --jq '.head.ref')
          echo "ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        # Skip per PR da fork: GITHUB_TOKEN non ha accesso al branch della fork.
        # Per `issue_comment` su PR da fork il problema non si pone al checkout
        # (usa il ref fetched via API), ma il successivo push (se l'agent
        # decide di committare) fallirebbe con 403. Per ora lasciamo girare
        # l'agent in read-only mode: non ha nulla di utile da pushare su una fork.
        if: |
          (github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment') ||
          github.event.pull_request.head.repo.fork == false
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || steps.pr-ref.outputs.ref || '' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run Pi agent (OpenAI)
        id: pi
        env:
          # Env var standard usata dal provider OpenAI del Pi SDK.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        uses: shaftoe/pi-coding-agent-action@v2.27.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: ${{ vars.PI_PROVIDER || 'openai' }}
          model: ${{ vars.PI_MODEL || 'gpt-5.6-sol' }}
          token: ${{ secrets.OPENAI_API_KEY }}
          thinking_level: ${{ vars.PI_THINKING_LEVEL || 'medium' }}
          # Full toolset: l'utente può chiedere /pi fix, /pi implement, /pi explain
          loaded_tools: all
          diff_ignore_patterns: 'pnpm-lock.yaml dist/ node_modules/ *.lock'
          # share_session: rimosso perché richiede un PAT con gist scope.
          # session_html resta disponibile come artifact per debug.
          export_session_html: true

      - name: Upload session HTML artifact
        if: ${{ steps.pi.outputs.session_html_path }}
        uses: actions/upload-artifact@v7
        with:
          name: pi-interactive-session-${{ github.event.issue.number || github.event.pull_request.number || github.run_number }}
          path: ${{ steps.pi.outputs.session_html_path }}
          retention-days: 14
