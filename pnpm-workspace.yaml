packages:
  - "packages/*"
  - "examples/*"
  # Nested published-package workspace with its own lockfile; keep it out of
  # the root install so Changesets version bumps cannot desync pnpm-lock.yaml
  # before those packages exist on npm.
  - "!examples/team-governed-proxy"

allowBuilds:
  esbuild: true

# Force patched transitive versions for known advisories.
overrides:
  "@hono/node-server": ">=2.0.5"
  "@vitest/mocker": ">=4.1.11 <5.0.0"
  "body-parser": ">=2.3.0"
  "brace-expansion": ">=5.0.9"
  "fast-uri": ">=4.1.4"
  "hono": ">=4.13.5"
  "ip-address": ">=10.7.0"
  "read-yaml-file>js-yaml": ">=3.15.2 <4.0.0"
  "js-yaml": ">=4.3.2 <5.0.0"
  "linkify-it": "5.0.2"
  "nanoid": ">=3.3.18 <4.0.0"
  "postcss": ">=8.5.18"
  "qs": ">=6.16.0"
  "vite": ">=8.0.16"
  "vitest": ">=4.1.11 <5.0.0"
